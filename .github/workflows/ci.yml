name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, musl-gcc]
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y musl-tools uidmap

      # make test runs vinit as PID 1 in unprivileged user namespaces.
      # Ubuntu 24.04 blocks those by default, and a service switches to
      # uid 65534, which needs a subordinate uid range.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"

      # The unit tests need ASan, which musl-gcc cannot link, so they always
      # use gcc. The matrix compiler builds what boots as PID 1.
      - name: Unit tests
        run: make test-unit

      - name: Contrib tools
        run: make test-contrib

      - name: vinit as PID 1 in namespaces
        run: |
          make CC=${{ matrix.cc }} rootfs
          tests/run-ns.sh build/rootfs > ns.out 2>&1 || {
            cat ns.out
            # Annotations show the cause on the run page without opening logs.
            { head -n 3 build/ns.log; grep FAIL ns.out | head -n 7; } | sed 's/^/::error::/'
            exit 1
          }

  # Coverage-guided fuzzing of the service file parser and resolver.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fuzz parser for 5 minutes
        run: make fuzz FUZZ_TIME=300

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
