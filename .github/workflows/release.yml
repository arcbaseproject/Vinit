name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build static musl binaries
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          make CC=musl-gcc
          strip vinit vinitctl
          mkdir dist
          tar -czf "dist/vinit-${GITHUB_REF_NAME}-x86_64-musl.tar.gz" vinit vinitctl LICENSE README.md
          cd dist && sha256sum -- * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --generate-notes --title "vinit $GITHUB_REF_NAME"
