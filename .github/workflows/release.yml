name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # For the signed build provenance attestation.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build static musl binaries
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          make CC=musl-gcc
          strip vinit vinitctl
          mkdir dist
          tar -czf "dist/vinit-${GITHUB_REF_NAME}-x86_64-musl.tar.gz" vinit vinitctl man LICENSE README.md
          cd dist && sha256sum -- * > SHA256SUMS

      # Users verify with: gh attestation verify FILE --repo arcbaseproject/Vinit
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --generate-notes --title "vinit $GITHUB_REF_NAME"
