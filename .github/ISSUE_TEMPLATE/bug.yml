name: Bug
description: Something vinit or vinitctl does wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue. Use private
        vulnerability reporting on this repository instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Service files and commands. A test in tests/services is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vinit version or commit
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console log
      render: text
